services:
  - type: web
    name: phone-book-ussd
    runtime: python
    plan: free
    # Test accounts (scripts/seed_test_accounts.py) are created only when SEED_TEST_ACCOUNTS=true is set below
    buildCommand: pip install -r requirements.txt && python scripts/seed_test_accounts.py --deploy
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: AT_VOICE_NUMBER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CONTACTS_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TICK_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY  # optional: AI answers in the /help chat
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SEED_TEST_ACCOUNTS  # "true": create the test organisations and people on each deploy (password 12345678, PIN 1234)
        sync: false
      - key: SEED_TEST_STAFF  # "true": also the test platform staff (incl. a Super Admin with password 12345678). Leave unset in production
        sync: false
