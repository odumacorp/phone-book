<style>
  /* Light, calm and roomy: always light, regardless of the computer's dark mode */
  :root {
    color-scheme: light;
    --bg: #f6f8fb; --card: #ffffff; --text: #1f2a37; --muted: #6b7785; --line: #e6eaf0; --soft: #f1f4f8;
    --primary: #1f6feb; --primary-soft: #eaf2ff; --primary-text: #ffffff;
    --ok: #17803d; --ok-bg: #e8f6ee; --warn: #8a5a00; --warn-bg: #fff6e0; --bad: #c0362c; --bad-bg: #fdeceb;
    --radius: 14px; --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 2px 8px rgba(16, 24, 40, .04);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* even on elements styled display: flex */
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .layout { display: flex; min-height: 100vh; }
  .side { width: 250px; flex: 0 0 250px; background: var(--card); border-right: 1px solid var(--line); padding: 22px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; padding: 0 10px 18px; }
  .brand img { width: 32px; height: 32px; border-radius: 50%; }
  .side h6 { margin: 18px 10px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .side a.item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--text); font-size: 15px; }
  .side a.item:hover { background: var(--soft); text-decoration: none; }
  .side a.item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .side .icon { width: 22px; text-align: center; }
  .side .who { margin: 22px 10px 0; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .content { flex: 1; min-width: 0; padding: 30px 36px 60px; max-width: 1080px; }
  .page-head { margin-bottom: 22px; }
  .page-head h1 { font-size: 26px; margin: 0 0 4px; font-weight: 700; }
  .page-head p { margin: 0; color: var(--muted); max-width: 720px; }
  .crumb { font-size: 14px; margin-bottom: 8px; display: inline-block; }
  .price-lines { width: 100%; max-width: 640px; border-collapse: collapse; }
  .price-lines td { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .price-lines td.num { text-align: right; white-space: nowrap; padding-left: 16px; }
  .price-lines tr.price-sum td { font-weight: 800; font-size: 17px; border-bottom: 2px solid var(--text, #111); padding-top: 10px; }
  .role-toggle { background: none; border: 0; padding: 0; font: inherit; color: var(--primary); cursor: pointer; text-align: left; }
  .role-toggle b { color: inherit; }
  .role-toggle .caret { font-size: 12px; color: var(--muted); }
  .role-people td { background: var(--bg, #f7f8fa); }
  .person-chip { display: inline-block; margin: 3px 6px 3px 0; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); text-decoration: none; font-size: 14px; }
  .person-chip:hover { border-color: var(--primary); }
  .org-head { display: flex; align-items: center; gap: 10px; margin: 18px 10px 6px; }
  .org-head h6 { margin: 0; }
  .org-logo { width: 36px; height: 36px; border-radius: 8px; object-fit: contain; background: #fff; border: 1px solid var(--line); flex: none; }
  .org-logo.big { width: 88px; height: 88px; border-radius: 14px; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 12px; padding: 6px 12px 6px 10px; border: 1px solid var(--line);
    border-radius: 999px; background: var(--card); color: inherit; font-size: 14px; font-weight: 600; text-decoration: none; }
  .back-btn:hover { border-color: var(--primary); color: var(--primary); }
  .back-btn span { font-size: 16px; line-height: 1; }
  h2 { font-size: 18px; margin: 0 0 6px; }
  h3 { font-size: 16px; margin: 0 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .card > p.muted:first-of-type { margin-top: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .help { color: var(--muted); font-size: 14px; margin: 2px 0 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); color: inherit; display: block; }
  a.stat:hover { border-color: var(--primary); text-decoration: none; }
  .stat b { display: block; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 14px; }
  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .action { display: block; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; color: var(--text); box-shadow: var(--shadow); }
  .action:hover { border-color: var(--primary); text-decoration: none; }
  .action .icon { font-size: 22px; }
  .action b { display: block; margin: 6px 0 2px; }
  .action span { color: var(--muted); font-size: 14px; }
  .feature { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--line); }
  .feature:first-of-type { border-top: 0; padding-top: 4px; }
  .feature p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 99px; margin-left: 6px; vertical-align: 2px; white-space: nowrap; }
  .on { color: var(--ok); background: var(--ok-bg); }
  .off { color: var(--muted); background: var(--soft); }
  .warn { color: var(--warn); background: var(--warn-bg); }
  .bad { color: var(--bad); background: var(--bad-bg); }
  .open { color: var(--warn); background: var(--warn-bg); }
  button, .btn { font: inherit; font-size: 15px; font-weight: 600; border-radius: 10px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--primary); background: var(--primary); color: var(--primary-text); white-space: nowrap; display: inline-block; }
  .btn:hover { text-decoration: none; }
  button.secondary, .btn.secondary { background: var(--card); color: var(--primary); border-color: var(--line); }
  button.secondary:hover, .btn.secondary:hover { border-color: var(--primary); }
  button.danger { background: var(--card); color: var(--bad); border-color: var(--line); }
  button.danger:hover { border-color: var(--bad); }
  button.small, .btn.small { padding: 5px 11px; font-size: 14px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, textarea, select { font: inherit; color: var(--text); background: #fff; border: 1px solid #d6dce4; border-radius: 10px; padding: 10px 12px; width: 100%; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
  textarea { min-height: 120px; resize: vertical; }
  input[type=checkbox], input[type=radio] { width: 18px; height: 18px; padding: 0; vertical-align: -3px; flex: 0 0 auto; accent-color: var(--primary); }
  .combo input.combo-text { margin-top: 8px; }
  optgroup { font-weight: 600; color: var(--muted); }
  .audience-picker .aud { display: none; }
  .audience-picker:has(input[type=radio][value=some]:checked) .aud { display: block; }
  .aud-row { margin-bottom: 6px; }
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; margin-bottom: 14px; }
  label.field small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row input { flex: 1 1 200px; width: auto; }
  .row input[type=checkbox], .row input[type=radio] { flex: 0 0 auto; width: 18px; }
  .row label.field input, .row label.field select { flex: none; width: 100%; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 4px 0 14px; font-size: 15px; }
  .checks label { display: flex; align-items: center; gap: 6px; font-weight: 400; }
  .flash { background: var(--ok-bg); color: var(--ok); border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; font-weight: 500; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
  .tip { background: var(--primary-soft); border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 11px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; border-top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:hover td { background: #fafbfd; }
  .list-item { padding: 16px 0; border-top: 1px solid var(--line); display: flex; gap: 14px; justify-content: space-between; align-items: flex-start; }
  .list-item:first-of-type { border-top: 0; padding-top: 4px; }
  .list-item .body { white-space: pre-wrap; margin: 6px 0; overflow-wrap: anywhere; }
  .empty { text-align: center; color: var(--muted); padding: 26px 10px; }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }
  details summary { cursor: pointer; font-weight: 600; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 14px; align-items: end; }
  .filters label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 14px; }
  form.inline { display: inline; }
  code { font-size: 14px; background: var(--soft); padding: 2px 6px; border-radius: 6px; overflow-wrap: anywhere; }
  .phone { width: 240px; background: #1f2a37; border-radius: 26px; padding: 14px; color: #e6edf5; }
  .phone pre { background: #0f1720; border-radius: 14px; padding: 14px; margin: 0; font: 14px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; min-height: 150px; }
  .phone .cap { text-align: center; font-size: 12px; color: #9fb0c3; margin-top: 8px; }
  .two { display: grid; grid-template-columns: 1fr 260px; gap: 18px; align-items: start; }
  .login { max-width: 400px; margin: 10vh auto 0; }
  .topbar-org, .menu-btn { display: none; }
  img { max-width: 100%; }
  /* Checkbox and radio labels read as one line of text (long ones wrap under the words, not into columns) */
  .checks label { display: block; padding-left: 26px; text-indent: -26px; }
  .checks label input[type=checkbox], .checks label input[type=radio] { margin: 0 8px 0 0; text-indent: 0; }
  .checks label > * { text-indent: 0; }
  @media (max-width: 820px) {
    .layout { display: block; }
    /* Phones and small tablets: a slim top bar; the menu opens from the Menu button */
    .side { position: sticky; top: 0; z-index: 20; width: auto; height: auto; max-height: 100vh; border-right: 0; border-bottom: 1px solid var(--line);
      padding: 10px 14px; box-shadow: var(--shadow); }
    .topbar { display: flex; align-items: center; gap: 10px; }
    .topbar .brand { padding: 0; font-size: 16px; flex: none; }
    .side .org-head { display: none; }
    .topbar-org { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; font-size: 14px; font-weight: 600; color: var(--muted); }
    .topbar-org span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar-org .org-logo { width: 26px; height: 26px; border-radius: 6px; }
    .topbar .brand:has(+ .topbar-org) { font-size: 0; gap: 0; }  /* in an organisation: logo only, the org's name beside it */
    .menu-btn { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
    .side-menu { display: none; }
    .side.menu-open .side-menu { display: block; max-height: calc(100vh - 64px); overflow-y: auto; padding: 8px 0 6px; }
    .side nav { display: block; }
    .side a.item { padding: 11px 10px; font-size: 16px; }
    .content { padding: 16px 16px 48px; max-width: none; }
    .page-head h1 { font-size: 23px; }
    .card { padding: 16px; border-radius: 12px; }
    .two { grid-template-columns: 1fr; }
    /* Wide tables scroll sideways inside their card instead of stretching the page */
    table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch;
      /* a soft shadow at an edge while there's more to swipe to */
      background: linear-gradient(to right, var(--card) 30%, rgba(255,255,255,0)), linear-gradient(to left, var(--card) 30%, rgba(255,255,255,0)) 100% 0,
        radial-gradient(farthest-side at 0 50%, rgba(16,24,40,.14), transparent), radial-gradient(farthest-side at 100% 50%, rgba(16,24,40,.14), transparent) 100% 0;
      background-repeat: no-repeat; background-size: 40px 100%, 40px 100%, 14px 100%, 14px 100%; background-attachment: local, local, scroll, scroll; }
    tr:hover td { background: transparent; }
    td code { white-space: nowrap; overflow-wrap: normal; }
    .row > label.field { flex: 1 1 100% !important; max-width: none !important; }
    th, td { padding: 9px 8px; }
    td { overflow-wrap: break-word; }
    td:first-child { min-width: 120px; }
    th { white-space: nowrap; }
    .list-item { flex-wrap: wrap; }
    .list-item > .row, .row[style*="nowrap"] { flex-wrap: wrap !important; }
    .page-head.row { flex-direction: column; align-items: flex-start !important; }
    .filters { grid-template-columns: 1fr; }
    .grid2 { grid-template-columns: 1fr; }
    button, .btn { white-space: normal; }
    .back-btn { margin-bottom: 10px; }
  }
</style>
