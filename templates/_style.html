<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1b2430; --muted: #5d6b7a; --line: #dfe4ea;
    --primary: #1565c0; --primary-text: #ffffff; --ok: #1b7f3b; --ok-bg: #e5f4ea;
    --warn: #8a5a00; --warn-bg: #fff4dc; --bad: #b3261e; --bad-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161c; --card: #1a2129; --text: #e6ebf0; --muted: #9aa7b4; --line: #2c3540;
      --primary: #64a8f0; --primary-text: #0b1520; --ok: #7fd49a; --ok-bg: #173323;
      --warn: #f0c46a; --warn-bg: #3a2e12; --bad: #f2a29c; --bad-bg: #3d1a18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .feature { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
  .feature:first-of-type { border-top: 0; padding-top: 0; }
  .feature p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; }
  .on { color: var(--ok); background: var(--ok-bg); }
  .off { color: var(--muted); background: var(--bg); border: 1px solid var(--line); }
  .warn { color: var(--warn); background: var(--warn-bg); }
  .open { color: var(--warn); background: var(--warn-bg); }
  .resolved { color: var(--ok); background: var(--ok-bg); }
  button, .btn { font: inherit; border-radius: 8px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--primary); background: var(--primary); color: var(--primary-text); white-space: nowrap; }
  button.secondary { background: transparent; color: var(--primary); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 64px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row input { flex: 1 1 200px; width: auto; }
  .flash { background: var(--ok-bg); color: var(--ok); border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .complaint { border-top: 1px solid var(--line); padding: 14px 0; }
  .complaint:first-of-type { border-top: 0; }
  .complaint .msg { white-space: pre-wrap; margin: 6px 0 10px; overflow-wrap: anywhere; }
  .tabs a { color: var(--primary); text-decoration: none; margin-right: 12px; }
  .tabs a.active { font-weight: 700; text-decoration: underline; }
  .nav { margin: 0 0 16px; }
  details summary { cursor: pointer; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; align-items: end; }
  .filters label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13px; }
  .filters .filter-actions { align-self: end; }
  select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  input[type=date] { color-scheme: light dark; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .chip { border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; color: var(--primary); text-decoration: none; font-size: 14px; }
  .chip.active { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
  .login { max-width: 360px; margin: 12vh auto 0; }
  code { font-size: 13px; background: var(--bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; border-top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--primary); }
  label.field { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  label.field input, label.field select, label.field textarea { color: var(--text); font-size: 15px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 14px; }
  form.inline { display: inline; }
  .bad { color: var(--bad); background: var(--bad-bg); }
</style>
